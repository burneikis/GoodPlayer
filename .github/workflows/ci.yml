name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-lgpl-shared-9.0.tar.xz

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          # ffmpeg (the CLI) only generates test media; the player links the
          # bundled FFmpeg below.
          sudo apt-get install -y libasound2-dev pkg-config clang ffmpeg
      - name: FFmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -sL "$FFMPEG_URL" | tar xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "FFMPEG_DIR=$RUNNER_TEMP/ffmpeg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg/lib" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release
